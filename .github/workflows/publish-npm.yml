name: Publish npm package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish-core-engine:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Verify npm auth
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is empty or not set"; exit 1
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build

      - name: Test
        run: npm test --workspace=core-engine

      # The CLI bundles core-engine, but the backends consume it as a normal
      # dependency, so it has to exist on the registry in its own right. This
      # job runs first: publishing the CLI against a core-engine version that
      # isn't there yet is the failure mode that broke the 1.2.0 release.
      - name: Publish @code-evolution/core-engine
        run: npm publish --workspace=core-engine --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cli:
    runs-on: ubuntu-latest
    needs: publish-core-engine

    defaults:
      run:
        working-directory: packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build

      - name: Publish code-evolution-lab
        run: npm publish --workspace=cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Users pin the action to the major tag (`@v1`, per the README). Move it to
  # this release once both packages are published, so `@v1` is never behind.
  # A tag pushed with GITHUB_TOKEN does not trigger another workflow run.
  move-major-tag:
    runs-on: ubuntu-latest
    needs: publish-cli
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point the major tag at this release
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
          echo "Moved $major to $GITHUB_REF_NAME ($GITHUB_SHA)"
