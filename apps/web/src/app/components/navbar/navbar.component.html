<nav class="navbar">
  <div class="container">
    <div class="navbar-content">
      <a routerLink="/" class="navbar-brand">
        <img src="codevolab_logo.png" alt="Code Evolution Lab" class="navbar-logo">
      </a>
      
      <div class="navbar-links" [class.mobile-open]="mobileMenuOpen">
        @if (auth.isAuthenticated()) {
          <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
            Dashboard
          </a>
          <a routerLink="/repositories" routerLinkActive="active" class="nav-link">
            Repositories
          </a>
        } @else {
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
            Home
          </a>
          <a routerLink="/login" routerLinkActive="active" class="nav-link">
            Login
          </a>
          <a routerLink="/register" routerLinkActive="active" class="nav-link">
            Register
          </a>
        }
      </div>

      <!-- User Profile Menu -->
      @if (auth.isAuthenticated()) {
        <div class="profile-menu-container">
          <button class="profile-button" (click)="toggleProfileMenu()" aria-label="User menu">
            <div class="profile-avatar">{{ getUserInitials() }}</div>
            <span class="profile-name">{{ getUserName() }}</span>
            <span class="dropdown-arrow">{{ profileMenuOpen ? '▲' : '▼' }}</span>
          </button>
          
          @if (profileMenuOpen) {
            <div class="profile-dropdown">
              <a routerLink="/profile" routerLinkActive="active" class="dropdown-item" (click)="closeProfileMenu()">
                <span class="item-icon">👤</span>
                Profile
              </a>
              <a routerLink="/settings" routerLinkActive="active" class="dropdown-item" (click)="closeProfileMenu()">
                <span class="item-icon">⚙️</span>
                Settings
              </a>
              <a routerLink="/settings/sessions" routerLinkActive="active" class="dropdown-item" (click)="closeProfileMenu()">
                <span class="item-icon">🔒</span>
                Sessions
              </a>
              <div class="dropdown-divider"></div>
              <button class="dropdown-item logout-item" (click)="logout()">
                <span class="item-icon">🚪</span>
                Logout
              </button>
            </div>
          }
        </div>
      }
      
      <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" aria-label="Toggle menu">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>
  </div>
</nav>
